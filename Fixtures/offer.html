<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CourseScanner — proposition TEST</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(88vw, 520px); padding: 32px; border-radius: 24px; background: #171f38; box-shadow: 0 20px 70px #0008; }
    .label { color: #a9b8e6; text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; }
    .amount { margin: 14px 0 28px; color: #55f3a4; font-size: clamp(4rem, 18vw, 6.5rem); font-weight: 800; }
    p { padding: 16px 0; margin: 0; border-top: 1px solid #2c3657; font-size: 1.05rem; line-height: 1.5; }
    strong { display: block; color: #a9b8e6; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
  </style>
</head>
<body>
  <main>
    <div class="label">Proposition de livraison — Test</div>
    <div class="amount">8,73 €</div>
    <p><strong>Restaurant</strong>Bistrot Test, 10 rue de Rivoli, Paris</p>
    <p><strong>Destination</strong>20 rue des Écoles, 75005 Paris</p>
  </main>
</body>
</html>
